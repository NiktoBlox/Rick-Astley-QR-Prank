<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>你信不信QR掃我?😂 | Rick Astley QR Prank</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at 50% 20%, #1f2937, #0f172a 90%);
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 32px 28px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      animation: float 4s ease-in-out infinite alternate;
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #f43f5e, #fb923c, #facc15);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.subtitle {
      color: #9ca3af;
      font-size: 0.95rem;
      margin-bottom: 24px;
    }
    .qr-container {
      position: relative;
      display: inline-block;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      background: #fff;
      padding: 8px;
    }
    .qr-container img {
      display: block;
      width: 100%;
      max-width: 360px;
      height: auto;
      border-radius: 12px;
    }
    .btn-group {
      margin-top: 24px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      padding: 10px 20px;
      border-radius: 9999px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, #ec4899, #f43f5e);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(244, 63, 94, 0.4);
    }
    .btn-primary:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(244, 63, 94, 0.6);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #e5e7eb;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    footer {
      margin-top: 32px;
      font-size: 0.85rem;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>你信不信QR掃我?😂</h1>
    <p class="subtitle">Rick Astley QR Code Prank 🕺</p>
    
    <div class="qr-container">
      <img src="./Rick-Astley-QR-Prank.gif" alt="Rick Astley QR Code">
    </div>

    <div class="btn-group">
      <a href="./Rick-Astley-QR-Prank.gif" download="Rick-Astley-QR-Prank.gif" class="btn btn-primary">📥 下載 GIF</a>
      <a href="https://github.com/NiktoBlox/Rick-Astley-QR-Prank" target="_blank" class="btn btn-secondary">⭐ GitHub 專案</a>
    </div>
  </div>

  <footer>
    Never Gonna Give You Up · Never Gonna Let You Down
  </footer>
</body>
</html>
