<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>你信不信QR掃我?😂</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at 50% 20%, #1f2937, #0f172a 90%);
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 32px 28px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      animation: float 4s ease-in-out infinite alternate;
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .gradient-text {
      background: linear-gradient(135deg, #f43f5e, #fb923c, #facc15);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .emoji {
      -webkit-text-fill-color: initial;
      display: inline-block;
    }
    .qr-container {
      position: relative;
      display: inline-block;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      background: #fff;
      padding: 8px;
    }
    .qr-container img {
      display: block;
      width: 100%;
      max-width: 360px;
      height: auto;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1><span class="gradient-text">你信不信QR掃我?</span><span class="emoji">😂</span></h1>
    
    <div class="qr-container">
      <img src="./Rick-Astley-QR-Prank.gif" alt="你信不信QR掃我?😂">
    </div>
  </div>
</body>
</html>
